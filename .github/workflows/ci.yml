name: Rust and data contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-training.txt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked
      - name: Replay measured sample
        run: cargo run --release --locked -p ghost_flow_server -- replay --model ../models/m-v1/model.json --events ../datasets/sample.jsonl
      - name: TCP faults and measured replay regression
        run: python ../tests/test_contract.py
      - name: Install CPU learning contract dependencies
        working-directory: .
        run: |
          python -m pip install -c requirements-training.txt numpy scikit-learn scipy joblib threadpoolctl
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Rescue protocol, causal preparation and learning regression
        working-directory: .
        run: python scripts/check_rescue_learning.py

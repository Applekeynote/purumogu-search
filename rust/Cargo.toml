[workspace]
members = ["crates/*", "apps/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
anyhow = "=1.0.102"
tokio = { version = "=1.52.3", features = ["net", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
protocol = { path = "crates/protocol" }
event_core = { path = "crates/event_core" }
graph = { path = "crates/graph" }
likelihood = { path = "crates/likelihood" }
inference = { path = "crates/inference" }
planner = { path = "crates/planner" }
evaluation = { path = "crates/evaluation" }
